# Project-wide Gradle settings.

# Use AndroidX instead of the legacy Support Library
android.useAndroidX=true

# Suppress the "compileSdk=35 not tested with this AGP version" warning.
# Safe to add — it's a warning, not an error. Remove once AGP ships SDK 35 support.
android.suppressUnsupportedCompileSdk=35

# Kotlin code style for this project: "official" or "obsolete"
kotlin.code.style=official

# Enable Gradle configuration cache for faster incremental builds
org.gradle.configuration-cache=true

# Increase Gradle JVM heap for large projects
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Build parallelism
org.gradle.parallel=true
