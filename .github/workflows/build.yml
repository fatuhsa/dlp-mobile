name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # yt-dlp ships a single static ARM64 binary — no Python needed on device
      - name: Download yt-dlp (arm64-v8a)
        run: |
          mkdir -p app/src/main/assets/bin/arm64-v8a
          curl -fsSL \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64 \
            -o app/src/main/assets/bin/arm64-v8a/yt-dlp
          chmod +x app/src/main/assets/bin/arm64-v8a/yt-dlp
          echo "Downloaded: $(ls -lh app/src/main/assets/bin/arm64-v8a/yt-dlp)"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dlp-mobile-debug-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Fires only on version tags, e.g. git tag v1.0.0 && git push origin v1.0.0
  release:
    name: Release APK (arm64-v8a)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download yt-dlp (arm64-v8a)
        run: |
          mkdir -p app/src/main/assets/bin/arm64-v8a
          curl -fsSL \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64 \
            -o app/src/main/assets/bin/arm64-v8a/yt-dlp
          chmod +x app/src/main/assets/bin/arm64-v8a/yt-dlp

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-unsigned.apk
          generate_release_notes: true

